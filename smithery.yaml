# Smithery configuration for Prefeitura RS Três Coroas: Certidão Negativa de Débitos
# Schema: https://smithery.ai/docs/build/project-config
# Remote HTTP MCP — server hosted at https://api.mcp.ai/p_pref_rs_tres_coroas_cnd

name: pref_rs_tres_coroas_cnd-mcp
displayName: "Prefeitura RS Três Coroas: Certidão Negativa de Débitos"
description: >
  Prefeitura RS Três Coroas: Certidão Negativa de Débitos, consulta em fonte oficial. Hospedado pela plataforma, sem credenciais da plataforma, pague por consulta com crédito pré-pago.

version: 0.1.0
license: MIT
homepage: https://github.com/mcp-dir/pref_rs_tres_coroas_cnd-mcp
repository: https://github.com/mcp-dir/pref_rs_tres_coroas_cnd-mcp

tags:
  - pref_rs_tres_coroas_cnd
  - brazil
  - horizontal
  - read-only

# Remote HTTP MCP — sem startCommand local (servidor já hospedado)
startCommand:
  type: http
  url: https://api.mcp.ai/p_pref_rs_tres_coroas_cnd

auth:
  type: oauth2
  resourceMetadataUrl: https://api.mcp.ai/p_pref_rs_tres_coroas_cnd/.well-known/oauth-protected-resource
  fallback:
    type: agent-auth
    description: >
      Para clientes sem OAuth 2.1. O agente expõe uma tool authenticate(token).
      Usuário gera o JWT em https://app.mcp.ai/agent-auth e cola no chat.
